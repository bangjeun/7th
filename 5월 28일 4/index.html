<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 팀 평면도 시뮬레이션</title>
    <link rel="stylesheet" href="jiyoon.css">
</head>
<body>

    <div class="main-screen">
        <img src="images/집.jpg" alt="우리 팀 웹페이지 평면도" class="responsive-fullscreen-img">

        <div class="pixel-character char-jiyoon">
            <img src="images/운.png" alt="지윤 캐릭터">
            <span class="char-name">지윤</span>
        </div>

        <div class="pixel-character char-taerin">
            <img src="images/t.png" alt="태린 캐릭터">
            <span class="char-name">태린</span>
        </div>

        <div class="pixel-character char-jaeon">
            <img src="images/언.png" alt="제언 캐릭터">
            <span class="char-name">제언</span>
        </div>

        <div class="pixel-character char-seungho">
            <img src="images/승.png" alt="승호 캐릭터">
            <span class="char-name">승호</span>
        </div>

        <div class="pixel-character char-dog">
    <img src="images/강아지.png" alt="강아지">
    <span class="char-name">멍멍이</span>
</div>

    </div>
    
    

</body>
